name: comfyui

services:
  comfyui:
    container_name: comfyui
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    security_opt:
      - no-new-privileges:true
    ports:
      - "8188:8188"
    volumes:
      - ./models:/comfy/models
      - ./input:/comfy/input
      - ./output:/comfy/output
      - ./workflows:/comfy/workflows
      - /etc/localtime:/etc/localtime:ro
    environment:
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION}
      - PYTORCH_ROCM_ARCH=${PYTORCH_ROCM_ARCH}
      - HSA_ENABLE_SDMA=${HSA_ENABLE_SDMA}
      - ROCR_VISIBLE_DEVICES=${ROCR_VISIBLE_DEVICES}
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    shm_size: '8gb'
    # Optional: Limit resources
    # deploy:
    #   resources:
    #     limits:
    #       memory: 16G
    #     reservations:
    #       memory: 8G
    restart: unless-stopped

volumes:
  models:
  input:
  output:
  workflows:
